apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-appointment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-appointment
  template:
    metadata:
      labels:
        app: hospital-appointment
    spec:
      containers:
        - name: hospital-appointment
          image: gopikaks/hospital-appointment-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-appointment-service
spec:
  type: NodePort
  selector:
    app: hospital-appointment
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
